[tools]
node = "26.13.1"
"github:elm/compiler" = "0.19.3"
"npm:@vscode/vsce" = "3.9.2"
python = "3.15.2"

[tasks.build]
description = "Build both viewers, standalone CLIs, and VS Code extensions"
depends = ["build:web", "build:cli", "build:vscode", "build:schema"]

[tasks."build:web"]
description = "Compile the website to main.js"
run = "./build.sh"

[tasks."build:cli"]
description = "Build the standalone CLI for this platform"
run = "./build.sh --cli"

[tasks."build:cli-js"]
description = "Build the Node.js version of the CLI"
run = "./build.sh --cli-js"

[tasks."build:vscode"]
description = "Package the VS Code extension as a VSIX"
run = "./build.sh --vscode"

[tasks."build:schema"]
description = "Build the JSON Schema website, CLI, and VS Code extension"
depends = ["build:schema-web", "build:schema-cli", "build:schema-vscode"]

[tasks."build:schema-web"]
description = "Compile the JSON Schema website"
run = "./build.sh --schema-web"

[tasks."build:schema-cli"]
description = "Build the standalone JSON Schema CLI"
run = "./build.sh --schema-cli"

[tasks."build:schema-cli-js"]
description = "Build the Node.js version of the JSON Schema CLI"
run = "./build.sh --schema-cli-js"

[tasks."build:schema-vscode"]
description = "Package the JSON Schema VS Code extension"
run = "./build.sh --schema-vscode"

[tasks.serve]
description = "Build both web viewers and serve them on localhost:8000"
depends = ["build:web", "build:schema-web"]
run = 'python -m http.server "${SEQDIAGRAM_PORT:-8000}" --bind 127.0.0.1'
